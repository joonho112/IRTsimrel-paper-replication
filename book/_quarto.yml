# Author: JoonHo Lee (jlee296@ua.edu)
project:
  type: book
  output-dir: _book
book:
  title: "Reliability-targeted IRT simulation"
  subtitle: "A step-by-step replication guide"
  author: "JoonHo Lee (jlee296@ua.edu)"
  site-url: https://joonho112.github.io/IRTsimrel-paper-replication/
  repo-url: https://github.com/joonho112/IRTsimrel-paper-replication
  repo-branch: main
  repo-subdir: book
  repo-actions: [source, issue]
  chapters:
    - index.qmd
    - 01-setup.qmd
    - 02-example.qmd
    - 03-validation.qmd
    - 04-applications.qmd
    - 05-displays.qmd
    - 06-checks.qmd
format:
  html:
    theme: cosmo
    toc: true
    code-copy: true
    code-overflow: wrap
    number-sections: false
    link-external-newwindow: true
execute:
  eval: false
